name: CI

on:
  schedule:
    - cron: "12 3 * * 3"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install uv
        run: python -m pip install uv==0.12.7
      - name: Sync locked environment
        run: uv sync --all-extras --frozen
      - name: Tests
        run: uv run python -m pytest -q
      - name: Fresh synthetic dispatch replay and independent checks
        run: |
          uv run python scripts/run_case.py configs/packed_bed_300c_flat.yaml --output-root .ci-results
          uv run python -c "import glob,json; files=glob.glob('.ci-results/*/run_manifest.json'); assert len(files)==1,files; d=json.load(open(files[0])); assert d['verification_passed'] and d['load_profile_synthetic'] and d['electricity_price_synthetic']; assert len(d['verification_checks'])>=1; print('Confirmed fresh synthetic solve and independent checks:',len(d['verification_checks']))"
      - name: Ruff
        run: |
          uv run ruff format --check .
          uv run ruff check .
