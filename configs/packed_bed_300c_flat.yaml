# Packed-bed sensible store (granite rock), 300 C saturated steam process,
# flat continuous load. Phase A baseline: constant discharge limit.
# Material/cost parameters and their sources: docs/DATA.md. Round-trip
# efficiency and standing loss are engineering assumptions, not literature
# figures; see docs/DATA.md's "Round-trip charge/discharge efficiency" note
# and the packed-bed parameter table.
#
# This is the technology the project's own hypothesis expects the
# SOC-dependent discharge correction to change the most (Phase C).

case_name: packed_bed_300c_flat

process:
  delivery_temperature_c: 300.0
  medium: steam
  profile_shape: flat
  profile_path: data/profiles/packed_bed_300c_flat.csv
  annual_peak_load_mw: 10.0

storage:
  technology: packed_bed
  energy_capacity_mwh: null   # sizing decision variable
  charge_power_max_mw: null
  discharge_power_max_mw: null
  eta_charge: 0.95            # [assumption] see docs/DATA.md
  eta_discharge: 0.95         # [assumption] see docs/DATA.md
  standing_loss_fraction_per_hour: 0.001   # [assumption] see docs/DATA.md
  temperature_max_c: 400.0    # design headroom above process temperature
  temperature_min_c: 320.0    # usable floor: below this the bed can no longer serve the 300 C load
  soc_init_fraction: 0.5
  soc_final_min_fraction: 0.5
  discharge_limit_mode: constant   # baseline; soc_dependent is Phase C's corrected case
  design_duration_hours: null   # free power sizing; the phase C2 matched-duration pair sets this instead

supply:
  electric_heater:
    efficiency: 0.99
    capacity_mw: 15.0
  backup_boiler:
    fuel: natural_gas
    fuel_cost_eur_per_mwh: 40.0    # [assumption] illustrative EU industrial gas price, not cited
    emission_factor_kg_co2_per_mwh: 202.0   # natural gas combustion, standard EU ETS default factor
    capacity_mw: 12.0    # sized above annual_peak_load_mw so unmet_heat stays at zero
  electricity_price_source: synthetic   # no ENTSOE_API_KEY configured; see docs/DATA.md

economics:
  currency: EUR
  discount_rate: 0.06
  storage_lifetime_years: 25.0
  storage_capex_eur_per_mwh: 7000.0    # mid of 5-8 $/kWh-th at scale; docs/DATA.md, Albrecht et al. 2016
  storage_capex_eur_per_mw: 20000.0    # [assumption] blowers/ducting/HX; see docs/DATA.md
  carbon_price_eur_per_tco2: 80.0      # [assumption] illustrative EU ETS-range figure, not a specific-year quote

optimization:
  solver: highs
  horizon_hours: 8760
  time_limit_seconds: 300.0
  mip_gap: 0.01
