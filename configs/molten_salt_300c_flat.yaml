# Two-tank molten salt (Solar Salt, NaNO3-KNO3 60:40), 300 C saturated steam
# process, flat continuous load. Phase A baseline: constant discharge limit.
# This is the project's control case: molten salt discharges at a near-constant
# temperature, so the SOC-dependent correction (Phase C) should barely move it.
# If it does move materially, the implementation is wrong; see CONTEXT/spec.
# Sources: docs/DATA.md.
#
# NOTE: this configuration is written but has not been solved yet in this
# session; only packed_bed_300c_flat.yaml has an actual recorded run so far.

case_name: molten_salt_300c_flat

process:
  delivery_temperature_c: 300.0
  medium: steam
  profile_shape: flat
  profile_path: data/profiles/molten_salt_300c_flat.csv
  annual_peak_load_mw: 10.0

storage:
  technology: molten_salt
  energy_capacity_mwh: null
  charge_power_max_mw: null
  discharge_power_max_mw: null
  eta_charge: 0.95            # [assumption] see docs/DATA.md
  eta_discharge: 0.95         # [assumption] see docs/DATA.md
  standing_loss_fraction_per_hour: 0.0005   # [assumption] see docs/DATA.md
  temperature_max_c: 565.0    # hot tank; Kearney 2003, docs/DATA.md
  temperature_min_c: 290.0    # cold tank; Kearney 2003, docs/DATA.md
  soc_init_fraction: 0.5
  soc_final_min_fraction: 0.5
  discharge_limit_mode: constant
  design_duration_hours: null   # free power sizing; see packed_bed_300c_flat's phase C2 pair for a matched-duration case
  discharge_capability_reference: null   # only meaningful when discharge_limit_mode is soc_dependent
  cycling_prevention_mode: none   # LP mode; no negative prices in these synthetic runs

supply:
  electric_heater:
    efficiency: 0.99
    capacity_mw: 15.0
  backup_boiler:
    fuel: natural_gas
    fuel_cost_eur_per_mwh: 40.0
    emission_factor_kg_co2_per_mwh: 202.0
    capacity_mw: 12.0
  electricity_price_source: synthetic

economics:
  currency: EUR
  discount_rate: 0.06
  storage_lifetime_years: 25.0
  storage_capex_eur_per_mwh: 26000.0   # mid of 22-30 $/kWh-th; docs/DATA.md, Albrecht et al. 2016
  storage_capex_eur_per_mw: 60000.0    # [assumption] pumps/heat exchangers; see docs/DATA.md
  carbon_price_eur_per_tco2: 80.0

optimization:
  solver: highs
  horizon_hours: 8760
  time_limit_seconds: 300.0
  mip_gap: 0.01
